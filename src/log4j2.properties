## log4j2 configuration for execution in IDE
### direct log messages to stdout ###

appender.stdout.type = Console
appender.stdout.name = stdout
appender.stdout.target = SYSTEM_OUT
appender.stdout.layout.type = PatternLayout
appender.stdout.layout.pattern = %d{ABSOLUTE} %5p %c{1}:%L - %m%n

### set log levels - for more verbose logging change 'info' to 'debug' ###
rootLogger = warn, stdout

logger.precapture.name = edu.harvard.mcz.precapture
logger.precapture.level = debug

logger.hibernate.name = org.hibernate
logger.hibernate.level = info

### log just the SQL (prepared statements with ? for parameters)
#logger.sql.name = org.hibernate.SQL
#logger.sql.level = debug

### log JDBC bind parameters ###
#logger.bind.name = org.hibernate.orm.jdbc.bind
#logger.bind.level = trace

