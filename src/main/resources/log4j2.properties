## log4j2 configuration for packaging in executable jar
## Log to file precapturedebug.log in the current working directory.

appender.file.type = File
appender.file.name = file
appender.file.fileName = precapturedebug.log
appender.file.append = true
appender.file.layout.type = PatternLayout
appender.file.layout.pattern = %d{ABSOLUTE} %5p %c{1}:%L - %m%n

### set log levels - for more verbose logging change 'info' to 'debug' ###
rootLogger = warn, file

logger.precapture.name = edu.harvard.mcz.precapture
logger.precapture.level = debug

logger.hibernate.name = org.hibernate
logger.hibernate.level = info

### log just the SQL (prepared statements with ? for parameters)
#logger.sql.name = org.hibernate.SQL
#logger.sql.level = debug

