# Build the executable jar (PreCaptureApp-<version>.jar, with all dependencies)
# and attach it to a GitHub release when the release is published.
#
# Release versions are numbered e.g. 1.1.3 and tagged v1.1.3.  Before tagging
# a release, set the <version> in pom.xml to the release version (removing
# -SNAPSHOT) and the <tag> in its <scm> section to the release tag; this
# workflow checks both match the release tag and fails if they don't.
#
# To rebuild and replace the jar on an existing release, run this workflow from
# the Actions tab (Run workflow) with the release's tag.

name: Release executable jar

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag of the existing release to build and attach the jar to, e.g. v1.1.3"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release-jar:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Check pom.xml has the release version and tag
        run: |
          VERSION="${TAG#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$TAG' is not a version tag such as v1.1.3"
            exit 1
          fi
          HELP=org.apache.maven.plugins:maven-help-plugin:3.5.2:evaluate
          POM_VERSION=$(mvn -B -q $HELP -Dexpression=project.version -DforceStdout)
          POM_SCM_TAG=$(mvn -B -q $HELP -Dexpression=project.scm.tag -DforceStdout)
          if [ "$POM_VERSION" != "$VERSION" ]; then
            echo "::error::pom.xml <version> is '$POM_VERSION', expected '$VERSION' for release tag '$TAG'"
            exit 1
          fi
          if [ "$POM_SCM_TAG" != "$TAG" ]; then
            echo "::error::pom.xml <scm><tag> is '$POM_SCM_TAG', expected '$TAG'"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build and test
        run: mvn -B package -Djava.awt.headless=true

      - name: Attach the jar to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JAR="PreCaptureApp-$VERSION.jar"
          cp "target/PreCaptureApp-$VERSION-jar-with-dependencies.jar" "$JAR"
          sha256sum "$JAR" > "$JAR.sha256"
          gh release upload "$TAG" "$JAR" "$JAR.sha256" --clobber
