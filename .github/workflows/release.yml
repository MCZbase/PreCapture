# Build the executable jar (PreCaptureApp-<version>.jar, with all dependencies)
# and attach it to a GitHub release when the release is published.
#
# The version is taken from the release tag, with a leading v removed (tag
# v1.1.3 builds version 1.1.3), and set in pom.xml for the build only.
#
# To rebuild and replace the jar on an existing release, run this workflow from
# the Actions tab (Run workflow) with the release's tag.

name: Release executable jar

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag of the existing release to build and attach the jar to, e.g. v1.1.3"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release-jar:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Set the version from the tag
        run: |
          VERSION="${TAG#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$TAG' is not a version such as v1.1.3"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          mvn -B -q org.codehaus.mojo:versions-maven-plugin:2.24.0:set \
            -DnewVersion="$VERSION" -DgenerateBackupPoms=false

      - name: Build and test
        run: mvn -B package -Djava.awt.headless=true

      - name: Attach the jar to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JAR="PreCaptureApp-$VERSION.jar"
          cp "target/PreCaptureApp-$VERSION-jar-with-dependencies.jar" "$JAR"
          sha256sum "$JAR" > "$JAR.sha256"
          gh release upload "$TAG" "$JAR" "$JAR.sha256" --clobber
