# Build and run the tests on every push (of one or more commits, to any
# branch).  A push of several commits is tested once, at its latest commit.

name: Test

on:
  push:

permissions:
  contents: read

# A newer push to the same branch supersedes a running test.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build and test
        run: mvn -B verify -Djava.awt.headless=true

      - name: Keep the test reports if the tests fail
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore
